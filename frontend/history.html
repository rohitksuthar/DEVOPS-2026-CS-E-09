<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  
  (function () {
    function guardCheck() {
      if (!localStorage.getItem("ib_token")) {
        window.location.replace("login.html");
      }
    }
    guardCheck();
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) guardCheck();
    });
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Datasets — InsightBoard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div id="topnav-root"></div>

    <main class="main-content">
      <div class="page-head">
        <div>
          <h1>My Datasets</h1>
          <p>Every dataset you've uploaded or analyzed in this browser.</p>
        </div>
        <div class="page-head-actions">
          <a href="upload.html" class="btn btn-primary"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Dataset</a>
        </div>
      </div>

      <div class="card" id="historyCard">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Dataset Name</th><th>Upload Date</th><th>Rows</th><th>Columns</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
        <div class="empty-state hidden" id="historyEmpty">
          <div class="empty-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
          <h3>No datasets yet</h3>
          <p>Upload your first CSV to see it appear here.</p>
          <a href="upload.html" class="btn btn-primary">Upload Dataset</a>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/history.js"></script>
</body>
</html>
